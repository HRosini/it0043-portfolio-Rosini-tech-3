<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Hans Jacob Rosini.">
  <title>Contact | Hans Jacob Rosini</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header"><div class="container header-inner">
    <a class="brand" href="index.html">Hans Jacob Rosini</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html">Home</a><a href="about.html">About</a><a href="skills.html">Skills</a><a aria-current="page" href="contact.html">Contact</a>
    </nav>
  </div></header>
  <main class="container page-main">
    <section class="page-heading"><p class="eyebrow">Contact</p><h1>Let’s connect</h1><p class="lead">Use the form below to send a project question or a friendly note.</p></section>
    <section class="card form-card">
      <form action="#" method="get">
        <div class="form-field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" required></div>
        <div class="form-field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="form-field"><label for="subject">Subject</label><input id="subject" name="subject" type="text" required></div>
        <div class="form-field"><label for="message">Message</label><textarea id="message" name="message" rows="5" required></textarea></div>
        <button class="button" type="submit">Send message</button>
      </form>
    </section>
  </main>
  <footer class="site-footer"><div class="container"><p>© 2026 Hans Jacob Rosini · Student portfolio</p></div></footer>
</body>
</html>
